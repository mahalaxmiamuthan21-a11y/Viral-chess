<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralChess - Play Quirky Chess Bots</title>
    <!-- SEO Meta Tags so Google understands your site -->
    <meta name="description" content="Play unique, viral chess variants and custom AI bots on ViralChess. Challenge the Drawfish, Chaos Chess, and more!">
    
    <!-- Include Chessboard CSS and jQuery -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://jquery.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; }
        #myBoard { width: 400px; max-width: 90vw; margin: 20px auto; }
        .controls { margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Welcome to ViralChess.com</h1>
    <p>Can you beat our custom bots?</p>
    
    <!-- The Chess Board Grid -->
    <div id="myBoard"></div>

    <div class="controls">
        <button onclick="resetGame()">Restart Game</button>
    </div>

    <script>
        // Basic chess integration initialization
        var board = null;
        var game = new Chess();

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if (piece.search(/^b/) !== -1) return false; // Player is always White for now
        }

        function makeRandomMove () {
            var possibleMoves = game.moves();
            if (possibleMoves.length === 0) return; // Game over

            var randomIdx = Math.floor(Math.random() * possibleMoves.length);
            game.move(possibleMoves[randomIdx]);
            board.position(game.fen());
        }

        function onDrop (source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' 
            });

            if (move === null) return 'snapback';

            // Replicate the viral twist: The bot instantly responds with a random/custom calculation
            window.setTimeout(makeRandomMove, 250);
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        board = Chessboard('myBoard', config);

        function resetGame() {
            game.reset();
            board.start();
        }
    </script>
</body>
</html>
